<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>Challenges – Pokémon Pitch Black 2</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
<meta name="description" content="Every gym leader, rival and boss of Pokémon Pitch Black 2: level caps, teams, items and movesets.">
<!--
  HOW TO EDIT THE TRAINERS
  Everything on this page comes from assets/data/trainers.json in the repo.
  Change a species, level, item, ability or move there and reload the page.
  "hidden": true on a trainer = spoiler, unlocked by clicking it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #07090d;
    --panel: #10141c;
    --panel-2: #161b26;
    --line: #232b3a;
    --line-2: #34405a;
    --text: #eaf0fb;
    --muted: #8e9ab2;
    --bolt: #2f7bff;
    --volt: #ffcb05;
    --display: "Anybody", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }
  .wrap { width: min(1240px, 100% - 32px); margin-inline: auto; }

  /* ───────── hero ───────── */
  .hero-zone { position: relative; isolation: isolate; overflow: hidden; }
  .hero-zone::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background:
      radial-gradient(760px 380px at 50% 18%, rgba(47,123,255,.34), transparent 70%),
      radial-gradient(420px 260px at 88% 8%, rgba(255,203,5,.07), transparent 70%);
  }
  .hero-zone::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 24px);
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 25%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 80% at 50% 25%, #000 0%, transparent 75%);
  }
  .topbar { padding-top: 16px; }
  .home-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px 9px 12px; border-radius: 999px;
    background: rgba(16,20,28,.7); border: 1px solid var(--line-2);
    color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 600;
    backdrop-filter: blur(8px);
    transition: border-color .15s, background .15s;
  }
  .home-link:hover { border-color: var(--volt); background: rgba(22,27,38,.9); }
  .home-link svg { width: 16px; height: 16px; }

  .hero { text-align: center; padding: 6px 0 38px; }
  .hero .logo {
    display: block; margin: 0 auto 8px; width: min(380px, 80vw); height: auto;
    filter: drop-shadow(0 0 26px rgba(47,123,255,.55)) drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%;
    font-size: clamp(30px, 5.6vw, 54px); line-height: 1.05; letter-spacing: .005em;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 40px rgba(47,123,255,.35);
  }

  /* ───────── toolbar ───────── */
  .searchbar {
    position: sticky; top: 0; z-index: 30; padding: 10px 0;
    background: rgba(7,9,13,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-block: 1px solid var(--line);
  }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search { position: relative; flex: 1 1 auto; min-width: 0; }
  .search svg.glass { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 46px; padding: 0 50px 0 44px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-size: 16px; font-weight: 500; -webkit-appearance: none; appearance: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input::placeholder { color: #67738c; }
  .search input:focus-visible { outline: none; border-color: var(--bolt); box-shadow: 0 0 0 3px rgba(47,123,255,.35); }
  .search kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    min-width: 24px; padding: 2px 7px; text-align: center; border-radius: 6px;
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted);
    font: 600 12px var(--body); pointer-events: none;
  }
  .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
  @media (hover: none) { .search kbd { display: none; } }
  .reset {
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    padding: 0 14px; height: 46px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; flex: none;
    transition: border-color .15s, background .15s;
  }
  .reset:hover { border-color: var(--volt); background: var(--panel); }
  .reset[hidden] { display: none; }
  .filters { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; }
  .count { color: var(--muted); font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .collapse {
    height: 34px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); font-size: 13.5px; font-weight: 600;
    transition: border-color .15s;
  }
  .collapse:hover { border-color: var(--volt); }
  .collapse[hidden] { display: none; }

  /* ───────── trainer rows (always one per row) ───────── */
  main { padding: 18px 0 48px; }
  .trainers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .trainer {
    --a: #6b7a9c;
    background: var(--panel); border-radius: 16px; overflow: hidden; scroll-margin-top: 84px;
    border: 1px solid color-mix(in srgb, var(--a) 30%, var(--line));
    transition: border-color .2s, box-shadow .2s;
  }
  .trainer[hidden] { display: none; }
  .trainer:hover { border-color: color-mix(in srgb, var(--a) 75%, var(--line)); }
  .trainer.open {
    border-color: color-mix(in srgb, var(--a) 80%, #fff 6%);
    box-shadow: 0 18px 50px rgba(0,0,0,.4), 0 0 0 1px color-mix(in srgb, var(--a) 30%, transparent);
  }
  .t-head {
    width: 100%; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto auto; align-items: center; gap: 16px;
    padding: 12px 18px 12px 14px; border: 0; color: inherit; text-align: left; cursor: pointer;
    background: linear-gradient(90deg, color-mix(in srgb, var(--a) 22%, var(--panel)), var(--panel) 62%);
  }
  .t-head:focus-visible { outline-offset: -3px; }
  .t-num {
    font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .02em; color: var(--muted);
    min-width: 30px; font-variant-numeric: tabular-nums;
  }
  .t-sprite {
    width: 80px; height: 80px; display: grid; place-items: center; border-radius: 14px; overflow: hidden;
    background: radial-gradient(circle at 50% 78%, rgba(255,255,255,.2), transparent 70%), color-mix(in srgb, var(--a) 34%, #0a0d13);
    border: 1px solid color-mix(in srgb, var(--a) 45%, transparent);
  }
  .t-sprite img { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  .t-sprite svg { width: 46px; height: 46px; color: rgba(255,255,255,.35); }
  .t-id { min-width: 0; }
  .t-name {
    margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: .005em;
    overflow-wrap: anywhere;
  }
  .t-role { margin-top: 3px; color: var(--muted); font-size: 14.5px; font-weight: 500; }
  .t-team { display: flex; gap: 2px; }
  .t-team .mini { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; background: color-mix(in srgb, var(--a) 14%, #0a0d13); }
  .t-team .mini img { display: block; image-rendering: pixelated; }
  .cap {
    flex: none; display: inline-flex; flex-direction: column; align-items: center; line-height: 1; padding: 7px 12px 8px;
    border-radius: 12px; background: color-mix(in srgb, var(--a) 24%, #0b0e14); border: 1px solid color-mix(in srgb, var(--a) 55%, transparent);
  }
  .cap small { font: 600 10.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .cap b { font-family: var(--display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
  .chev { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); }
  .chev svg { width: 18px; height: 18px; transition: transform .25s; }
  .trainer.open .chev svg { transform: rotate(180deg); }

  /* hidden (spoiler) trainers */
  .trainer.locked { --a: #8e9ab2; border-style: dashed; }
  .trainer.locked .t-head { background: repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 10px, transparent 10px 20px), var(--panel); }
  .trainer.locked .t-name { color: #cdd6e8; }
  .lock {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 6px; padding: 3px 11px 3px 8px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; color: var(--volt);
    background: rgba(255,203,5,.1); border: 1px solid rgba(255,203,5,.4);
  }
  .lock svg { width: 14px; height: 14px; }

  /* the drop-down */
  .t-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.2,.7,.2,1); }
  .trainer.open .t-panel { grid-template-rows: 1fr; }
  .t-inner { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s .32s; }
  .trainer.open .t-inner { visibility: visible; transition-delay: 0s; }
  .t-body { padding: 18px 18px 22px; border-top: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--a) 7%, var(--panel)), var(--panel) 70%); }
  .t-notes { margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; font-size: 14.5px; color: #cdd6e8; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--a); }
  .t-notes b { color: var(--text); }
  .bag { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
  .bag-label { font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  .bag .item { padding-right: 10px; }
  .bag .cnt { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
  .team { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

  /* a Pokémon of the team */
  .mon {
    --c1: #6b7a9c; --c2: #6b7a9c;
    display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; background: var(--panel-2);
    border: 1px solid color-mix(in srgb, var(--c1) 32%, var(--line));
  }
  .m-stage {
    --t1: color-mix(in srgb, var(--c1) 46%, #0a0d13);
    --t2: color-mix(in srgb, var(--c2) 46%, #0a0d13);
    position: relative; height: 150px;
    background:
      radial-gradient(110px 80px at 50% 68%, rgba(255,255,255,.2), transparent 72%),
      linear-gradient(to top, rgba(7,9,13,.7), transparent 55%),
      linear-gradient(112deg, var(--t1) 0 49.3%, rgba(255,255,255,.38) 49.3% 50.2%, var(--t2) 50.2% 100%);
  }
  .mon.mono .m-stage { background:
      radial-gradient(110px 80px at 50% 68%, rgba(255,255,255,.2), transparent 72%),
      linear-gradient(to top, rgba(7,9,13,.7), transparent 55%),
      linear-gradient(112deg, var(--t1), color-mix(in srgb, var(--c1) 26%, #0a0d13)); }
  .m-sprite { position: absolute; inset: 12px 0 34px; display: grid; justify-items: center; align-items: end; }
  .m-sprite img { display: block; }
  .m-lv {
    position: absolute; top: 10px; left: 12px; z-index: 2; padding: 2px 10px; border-radius: 8px;
    font-family: var(--display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
    background: rgba(7,9,13,.66); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(6px);
  }
  .m-lv small { font: 600 11px var(--body); margin-right: 4px; opacity: .8; }
  .m-types { position: absolute; z-index: 2; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .type { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 4px; border-radius: 999px; background: rgba(7,9,13,.62); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 13.5px; font-weight: 600; }
  .type img { width: 24px; height: 24px; display: block; }
  .tico { display: block; width: 22px; height: 22px; flex: none; }
  .tfb { display: inline-block; padding: 1px 7px; border-radius: 4px; font: 700 10px var(--body); letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--tc, #6b7a9c); border: 1px solid rgba(255,255,255,.35); }
  .m-body { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; }
  .m-name { margin: 0; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.1; overflow-wrap: anywhere; }
  .m-meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .ability {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line); color: #dbe3f4;
    font-size: 13.5px; font-weight: 500; text-decoration: none; transition: border-color .15s, background .15s;
  }
  a.ability:hover { border-color: color-mix(in srgb, var(--c1) 70%, var(--line)); background: color-mix(in srgb, var(--c1) 16%, var(--panel)); color: #fff; }
  .ability svg { width: 9px; height: 9px; flex: none; color: color-mix(in srgb, var(--c1) 62%, #fff); }
  .item {
    display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 2px; height: 36px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line); color: #dbe3f4; font-size: 13.5px; font-weight: 500;
  }
  .item img { width: 32px; height: 32px; display: block; image-rendering: pixelated; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; object-fit: contain; }
  .m-moves { list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 6px; }
  .move {
    display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 7px; border-radius: 10px;
    color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 600; min-height: 34px;
    background: color-mix(in srgb, var(--mc) 15%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--mc) 38%, transparent);
    transition: background .15s, border-color .15s, transform .15s;
  }
  a.move:hover { background: color-mix(in srgb, var(--mc) 28%, var(--panel)); border-color: color-mix(in srgb, var(--mc) 80%, #fff 5%); transform: translateY(-1px); }
  .move .tico, .move .tfb { flex: none; }
  .mname { min-width: 0; overflow-wrap: anywhere; }

  .empty { text-align: center; color: var(--muted); padding: 70px 0 30px; font-size: 17px; }
  .empty strong { display: block; color: var(--text); font-size: 20px; margin-bottom: 4px; }
  .empty .reset { margin-top: 16px; height: 42px; }
  .empty[hidden] { display: none; }
  .error { margin: 24px 0; padding: 16px 18px; border-radius: 12px; background: #2a1216; border: 1px solid #7a2a35; color: #ffd3d8; }
  .error code { display: block; margin-top: 8px; white-space: pre-wrap; font-size: 13.5px; color: #fff; }

  /* ───────── footer ───────── */
  .site-footer {
    padding: 34px 0 44px; text-align: center; border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(47,123,255,.12), transparent 80%);
  }
  .credits {
    margin: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 8px 18px; color: var(--muted); font-size: 14.5px;
  }
  .credits .game { color: var(--volt); font-family: var(--display); font-weight: 800; font-stretch: 112%; letter-spacing: .01em; font-size: 15.5px; }
  .credits strong { color: var(--text); font-weight: 700; }
  .credits .rule { width: 1px; height: 16px; background: var(--line-2); }

  .to-top {
    position: fixed; right: 18px; bottom: 18px; z-index: 40; width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center; border: 0; cursor: pointer;
    background: var(--volt); color: #0a0d13; box-shadow: 0 10px 28px rgba(0,0,0,.5);
    opacity: 0; visibility: hidden; transform: translateY(8px);
    transition: opacity .2s, transform .2s, visibility .2s;
  }
  .to-top.show { opacity: 1; visibility: visible; transform: none; }
  .to-top svg { width: 20px; height: 20px; }

  @media (max-width: 900px) { .t-team { display: none; } .t-head { grid-template-columns: auto auto minmax(0, 1fr) auto auto; } }
  @media (max-width: 560px) {
    .t-head { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "spr id chev" "spr cap cap"; gap: 6px 12px; padding: 12px; }
    .t-num { display: none; }
    .t-sprite { grid-area: spr; width: 64px; height: 64px; }
    .t-id { grid-area: id; }
    .cap { grid-area: cap; flex-direction: row; gap: 8px; justify-self: start; padding: 4px 10px; }
    .cap small { margin: 0; }
    .cap b { font-size: 18px; }
    .chev { grid-area: chev; }
    .t-name { font-size: 22px; }
    .team { grid-template-columns: 1fr; }
    .credits { flex-direction: column; gap: 6px; }
    .credits .rule { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .t-panel, .chev svg, .to-top, .t-inner { transition: none; }
  }
</style>
</head>
<body>

<div class="hero-zone">
  <div class="wrap">
    <div class="topbar">
      <a class="home-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        Home
      </a>
    </div>
    <header class="hero">
      <img class="logo" id="logo" src="https://raw.githubusercontent.com/lucaremix/pokemon-pitch-black-2/main/assets/images/logofull.png" alt="Pokémon Pitch Black 2" width="1774" height="887" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='assets/images/logofull.png'}">
      <h1>Challenges</h1>
    </header>
  </div>
</div>

<div class="searchbar">
  <div class="wrap search-row">
    <div class="search">
      <svg class="glass" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search trainer, Pokémon, move, item or ability" aria-label="Search challenges" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <button class="reset" id="reset" type="button" hidden>Clear</button>
  </div>
</div>

<section class="wrap filters" aria-label="Status">
  <span class="count" id="count" role="status" aria-live="polite"></span>
  <button class="collapse" id="collapse" type="button" hidden>Collapse all</button>
</section>

<main class="wrap">
  <div id="error" class="error" hidden></div>
  <ol class="trainers" id="list"></ol>
  <div class="empty" id="empty" hidden>
    <strong>No trainer matches your search.</strong>
    Try another name, Pokémon or move.
    <div><button class="reset" id="reset2" type="button">Clear search</button></div>
  </div>
  <noscript><p class="empty">Turn on JavaScript to see the trainers.</p></noscript>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="credits">
      <span class="game">Pokémon Pitch Black 2</span>
      <span class="rule" aria-hidden="true"></span>
      <span>Pokémon &copy; Nintendo / Game Freak</span>
      <span class="rule" aria-hidden="true"></span>
      <span>created by <strong>lucaremix</strong></span>
    </p>
  </div>
</footer>

<button class="to-top" id="toTop" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg>
</button>

<script>
// Data lives in assets/data/trainers.json (same repo): edit that file, not this page.
const DATA_URLS = [
  "https://raw.githubusercontent.com/lucaremix/pokemon-pitch-black-2/main/assets/data/trainers.json",
  "assets/data/trainers.json"
];

function start(DB) {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), empty = $("empty"), countEl = $("count"), q = $("q"), errBox = $("error");
  var resetBtns = [$("reset"), $("reset2")], collapseBtn = $("collapse"), toTop = $("toTop");

  var TYPE_COLORS = {
    Normal: "#a8a77a", Fire: "#ee8130", Water: "#6390f0", Electric: "#f7d02c", Grass: "#7ac74c",
    Ice: "#96d9d6", Fighting: "#c22e28", Poison: "#a33ea1", Ground: "#e2bf65", Flying: "#a98ff3",
    Psychic: "#f95587", Bug: "#a6b91a", Rock: "#b6a136", Ghost: "#735797", Dragon: "#6f35fc",
    Dark: "#705746", Steel: "#b7b7ce", Fairy: "#d685ad"
  };
  var TYPE_ICONS = {};
["Normal","Fighting","Flying","Poison","Ground","Rock","Bug","Ghost","Fire","Water","Grass","Electric","Psychic","Ice","Dragon","Dark","Steel","Fairy","Sound"]
  .forEach(function (t) { TYPE_ICONS[t] = "https://raw.githubusercontent.com/lucaremix/pokemon-pitch-black-2/main/assets/images/typinglogos/" + t.toLowerCase() + ".svg"; });
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var DIAMOND = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0l5 5-5 5-5-5z" fill="currentColor"/></svg>';
  var MYSTERY = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="14" r="8"/><path d="M8 42c0-9 7-15 16-15s16 6 16 15"/></svg>';
  var PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 96 96"><circle cx="48" cy="48" r="30" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4"/><path d="M18 48h60" stroke="#fff" stroke-opacity=".55" stroke-width="4"/><circle cx="48" cy="48" r="8" fill="#10141c" stroke="#fff" stroke-opacity=".55" stroke-width="4"/></svg>');

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  // ── data ──
  DB = DB || {};
  var META = DB.meta || {};
  var URLS = Object.assign({
    trainer: "https://play.pokemonshowdown.com/sprites/trainers/{sprite}.png",
    pokemon: "https://play.pokemonshowdown.com/sprites/gen5ani/{sprite}.gif",
    item: "https://play.pokemonshowdown.com/sprites/itemicons/{item}.png"
  }, META.urls || {});
  var fill = function (kind, vars) { return URLS[kind].replace(/\{(\w+)\}/g, function (m, k) { return encodeURIComponent(vars[k] == null ? "" : vars[k]); }); };
  var itemSlug = function (n) { return String(n).toLowerCase().replace(/['’.]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); };
  var TRAINERS = (DB.trainers || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  var abilityURL = function (a) { return "https://bulbapedia.bulbagarden.net/wiki/" + encodeURIComponent(a.trim().replace(/\s+/g, "_")) + "_(Ability)"; };
  var moveURL = function (n) {
    if (/\(TBD\)/i.test(n)) return "";
    if (/^Hidden Power/i.test(n)) n = "Hidden Power";
    return "https://bulbapedia.bulbagarden.net/wiki/" + encodeURIComponent(n.trim().replace(/\s+/g, "_")) + "_(move)";
  };

  // ── small renderers ──
  function typeBadge(t) {
    var icon = TYPE_ICONS[t] || "";
    return '<span class="type">' + (icon ? '<img src="' + icon + '" alt="" width="24" height="24" loading="lazy">' : "") + esc(t) + "</span>";
  }
  function typeImg(t) {
    var icon = TYPE_ICONS[t];
    return icon ? '<img class="tico" src="' + icon + '" alt="' + esc(t) + '" title="' + esc(t) + '" width="22" height="22" loading="lazy">' : '<span class="tfb" style="--tc:' + (TYPE_COLORS[t] || "#6b7a9c") + '">' + esc(t) + "</span>";
  }
  window.__fit = function (img) {
    var w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) return;
    var k = (+img.dataset.box || 96) / Math.max(w, h);
    img.style.width = Math.round(w * k) + "px"; img.style.height = Math.round(h * k) + "px";
    img.style.imageRendering = k > 1 ? "pixelated" : "auto";
  };
  function monImg(p, box, cls) {
    return '<img data-box="' + box + '" src="' + esc(fill("pokemon", { sprite: p.sprite })) + '" alt="' + esc(p.species) + '" loading="lazy" ' +
      'onload="window.__fit(this)" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'">';
  }
  function accentOf(t) {
    var n = {}, order = [];
    (t.pokemon || []).forEach(function (p) { (p.types || []).forEach(function (ty) { if (!(ty in n)) { n[ty] = 0; order.push(ty); } n[ty]++; }); });
    order.sort(function (a, b) { return n[b] - n[a] || order.indexOf(a) - order.indexOf(b); });
    return TYPE_COLORS[order[0]] || "#6b7a9c";
  }
  function moveHTML(m) {
    var c = TYPE_COLORS[m.type] || "#6b7a9c", url = moveURL(m.name);
    var inner = typeImg(m.type) + '<span class="mname">' + esc(m.name) + "</span>";
    return "<li>" + (url
      ? '<a class="move" style="--mc:' + c + '" href="' + url + '" target="_blank" rel="noopener noreferrer" title="' + esc(m.name) + ' on Bulbapedia">' + inner + "</a>"
      : '<span class="move" style="--mc:' + c + '">' + inner + "</span>") + "</li>";
  }
  function monHTML(p) {
    var ty = p.types || [], c1 = TYPE_COLORS[ty[0]] || "#6b7a9c", c2 = TYPE_COLORS[ty[1]] || c1;
    return '<li class="mon' + (ty.length < 2 ? " mono" : "") + '" style="--c1:' + c1 + ";--c2:" + c2 + '">' +
      '<div class="m-stage"><span class="m-lv"><small>Lv</small>' + esc(p.level) + "</span>" +
        '<div class="m-types">' + ty.map(typeBadge).join("") + "</div>" +
        '<div class="m-sprite">' + monImg(p, 96) + "</div></div>" +
      '<div class="m-body"><h4 class="m-name">' + esc(p.species) + "</h4>" +
        '<div class="m-meta">' +
          (p.ability ? '<a class="ability" href="' + abilityURL(p.ability) + '" target="_blank" rel="noopener noreferrer" title="' + esc(p.ability) + ' on Bulbapedia">' + DIAMOND + esc(p.ability) + "</a>" : "") +
          (p.item ? '<span class="item"><img src="' + esc(fill("item", { item: itemSlug(p.item) })) + '" alt="" width="32" height="32" loading="lazy" onerror="this.style.display=\'none\'">' + esc(p.item) + "</span>" : "") +
        "</div>" +
        '<ul class="m-moves" aria-label="Moves">' + (p.moves || []).map(moveHTML).join("") + "</ul></div></li>";
  }

  // ── trainer rows ──
  var revealed = new Set();
  var num2 = function (n) { return String(n).padStart(2, "0"); };
  function isLocked(t) { return !!t.hidden && !revealed.has(t.id); }

  function headHTML(t, i, panelId) {
    if (isLocked(t)) {
      return '<button class="t-head" type="button" aria-expanded="false" aria-controls="' + panelId + '" aria-label="Hidden battle, number ' + (i + 1) + '. Click to reveal the spoiler">' +
        '<span class="t-num">#' + num2(i + 1) + "</span>" +
        '<span class="t-sprite">' + MYSTERY + "</span>" +
        '<span class="t-id"><h3 class="t-name">Hidden battle</h3><span class="lock">' + LOCK + "Spoiler · click to reveal</span></span>" +
        '<span class="t-team"></span>' +
        '<span class="cap"><small>Lv cap</small><b>' + esc(t.levelCap) + "</b></span>" +
        '<span class="chev">' + CHEV + "</span></button>";
    }
    var team = (t.pokemon || []).map(function (p) { return '<span class="mini">' + monImg(p, 38) + "</span>"; }).join("");
    return '<button class="t-head" type="button" aria-expanded="false" aria-controls="' + panelId + '">' +
      '<span class="t-num">#' + num2(i + 1) + "</span>" +
      '<span class="t-sprite"><img src="' + esc(fill("trainer", { sprite: t.sprite })) + '" alt="' + esc(t.name) + '" loading="lazy" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'"></span>' +
      '<span class="t-id"><h3 class="t-name">' + esc(t.name) + '</h3><div class="t-role">' + esc([t.role, t.location].filter(Boolean).join(" · ")) + "</div></span>" +
      '<span class="t-team" aria-hidden="true">' + team + "</span>" +
      '<span class="cap"><small>Lv cap</small><b>' + esc(t.levelCap) + "</b></span>" +
      '<span class="chev">' + CHEV + "</span></button>";
  }
  function liHTML(t, i) {
    var id = "panel-" + i;
    return headHTML(t, i, id) + '<div class="t-panel" id="' + id + '"><div class="t-inner"><div class="t-body"></div></div></div>';
  }
  function bagHTML(t) {
    var b = t.bag || []; if (!b.length) return "";
    return '<ul class="bag" aria-label="Healing items"><li class="bag-label">Bag</li>' + b.map(function (x) {
      return '<li class="item"><img src="' + esc(fill("item", { item: itemSlug(x.item) })) + '" alt="" width="32" height="32" loading="lazy" onerror="this.style.display=\'none\'">' +
        esc(x.item) + ' <span class="cnt">\u00d7' + esc(x.count) + "</span></li>";
    }).join("") + "</ul>";
  }
  function fillPanel(li) {
    var body = li.querySelector(".t-body");
    if (body.dataset.ready) return;
    var t = TRAINERS[+li.dataset.i];
    body.innerHTML = bagHTML(t) + '<ul class="team" aria-label="' + esc(t.name) + ' team">' + (t.pokemon || []).map(monHTML).join("") + "</ul>";
    body.dataset.ready = "1";
  }
  function render() {
    list.innerHTML = TRAINERS.map(function (t, i) {
      return '<li class="trainer' + (isLocked(t) ? " locked" : "") + '" data-i="' + i + '" style="--a:' + (isLocked(t) ? "#8e9ab2" : accentOf(t)) + '">' + liHTML(t, i) + "</li>";
    }).join("");
  }
  render();
  var items = Array.prototype.slice.call(list.children);

  function setOpen(li, on) {
    li.classList.toggle("open", on);
    var b = li.querySelector(".t-head"); if (b) b.setAttribute("aria-expanded", on ? "true" : "false");
    if (on) fillPanel(li);
    collapseBtn.hidden = !list.querySelector(".trainer.open");
  }
  function reveal(li) {
    var i = +li.dataset.i, t = TRAINERS[i];
    revealed.add(t.id);
    li.classList.remove("locked");
    li.style.setProperty("--a", accentOf(t));
    li.innerHTML = liHTML(t, i);
    setOpen(li, true);
  }
  list.addEventListener("click", function (e) {
    var head = e.target.closest(".t-head"); if (!head) return;
    var li = head.closest(".trainer");
    if (li.classList.contains("locked")) { reveal(li); return; }
    setOpen(li, !li.classList.contains("open"));
  });
  collapseBtn.addEventListener("click", function () { items.forEach(function (li) { if (li.classList.contains("open")) setOpen(li, false); }); });

  // ── search (spoiler trainers never match until they are revealed) ──
  function hayOf(t) {
    var parts = [t.name, t.role, t.location, t.id];
    (t.bag || []).forEach(function (x) { parts.push(x.item); });
    (t.pokemon || []).forEach(function (p) {
      parts.push(p.species, p.ability, p.item); (p.types || []).forEach(function (x) { parts.push(x); });
      (p.moves || []).forEach(function (m) { parts.push(m.name); });
    });
    return parts.join(" ").toLowerCase();
  }
  var HAY = TRAINERS.map(hayOf);
  function apply() {
    var term = q.value.trim().toLowerCase(), shown = 0;
    TRAINERS.forEach(function (t, i) {
      var ok = !term || (!isLocked(t) && HAY[i].indexOf(term) !== -1);
      items[i].hidden = !ok; if (ok) shown++;
    });
    countEl.textContent = (shown === TRAINERS.length ? TRAINERS.length : shown + " of " + TRAINERS.length) + " trainers";
    empty.hidden = shown !== 0;
    resetBtns[0].hidden = !term;
  }
  apply();
  q.addEventListener("input", apply);
  resetBtns.forEach(function (b) { b.addEventListener("click", function () { q.value = ""; apply(); q.focus(); }); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault(); q.focus();
  });
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.addEventListener("scroll", function () { toTop.classList.toggle("show", window.scrollY > 900); }, { passive: true });
  toTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); });
}

// ───────── load the JSON ─────────
(async function load() {
  const statusEl = document.getElementById("count");
  statusEl.textContent = "Loading trainers…";
  let lastErr;
  for (const url of DATA_URLS) {
    try {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status + " on " + url);
      const json = await res.json();
      start(Array.isArray(json) ? { trainers: json } : json);
      return;
    } catch (err) { lastErr = err; }
  }
  statusEl.textContent = "";
  const box = document.getElementById("error");
  box.hidden = false;
  box.innerHTML = "<strong>Could not load the trainers data.</strong> Check that assets/data/trainers.json exists and is valid JSON." +
    "<code>" + String(lastErr ? lastErr.message : "unknown error").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</code>";
})();
</script>
